name: Merge

on:
  schedule:
    - cron: '0 20 * * *'  # UTC 20:00 / SGT 04:00 next day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/Merge.yml'
      - 'scripts/sync_rules.py'
      - 'tests/test_sync_rules.py'

permissions:
  contents: write

concurrency:
  group: sync-merge-main
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Test validation and publication
        run: |
          if python3 -m unittest discover -s tests -p 'test_sync_rules.py' -v; then
            echo 'Rule sync tests passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Rule sync tests failed; publication was skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Download, validate and publish
        run: python3 scripts/sync_rules.py merge --publish --attempts 3
