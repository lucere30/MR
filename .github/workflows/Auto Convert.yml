name: Auto Convert

on:
  schedule:
    - cron: '0 21 * * *'  # 每天 UTC 21:00 运行
  push:
    branches: [main]
    paths:
      - 'lq/*.list'
      - 'lq/*.txt'
      - 'scripts/loon_to_singbox.py'
      - 'scripts/loon_to_clash.py'
      - 'scripts/auto_convert.py'
      - 'tests/test_loon_to_singbox.py'
      - 'tests/test_loon_to_clash.py'
      - 'tests/test_auto_convert.py'
      - '.github/workflows/Auto Convert.yml'
  workflow_run:
    workflows: [Merge, Sync and Process ADLite]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_clash:
        description: Convert and publish Clash rules
        type: boolean
        default: true
      enable_singbox:
        description: Convert and publish sing-box domain/IP rules
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-convert-main
  cancel-in-progress: false

jobs:
  convert:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Stringify manual booleans so false does not fall through to the default.
      ENABLE_CLASH: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_clash) || vars.ENABLE_CLASH || 'true' }}
      ENABLE_SINGBOX: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.enable_singbox) || vars.ENABLE_SINGBOX || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install YAML validator
        if: env.ENABLE_CLASH == 'true'
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Test publication and retry behavior
        run: python3 -m unittest discover -s tests -p 'test_auto_convert.py' -v

      - name: Convert, validate and publish enabled formats
        run: python3 scripts/auto_convert.py --attempts 3 --clash "$ENABLE_CLASH" --singbox "$ENABLE_SINGBOX"
