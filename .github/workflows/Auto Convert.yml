name: Auto Convert

on:
  schedule:
    - cron: '0 21 * * *'  # 每天 UTC 21:00 运行
  push:
    branches: [main]
    paths:
      - 'lq/*.list'
      - 'lq/*.txt'
      - 'scripts/loon_to_singbox.py'
      - 'scripts/loon_to_clash.py'
      - 'scripts/auto_convert.py'
      - 'tests/test_loon_to_singbox.py'
      - 'tests/test_loon_to_clash.py'
      - 'tests/test_auto_convert.py'
      - '.github/workflows/Auto Convert.yml'
  workflow_run:
    workflows: [Merge, Sync and Process ADLite]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-convert-main
  cancel-in-progress: false

jobs:
  convert:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install YAML validator
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Test publication and retry behavior
        run: python3 -m unittest discover -s tests -p 'test_auto_convert.py' -v

      - name: Convert, validate and publish both formats
        run: python3 scripts/auto_convert.py --attempts 3
